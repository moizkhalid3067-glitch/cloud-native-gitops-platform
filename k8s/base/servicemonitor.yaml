apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-demo
  namespace: platform-demo
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-demo
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
